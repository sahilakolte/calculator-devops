name: calculator

services:
  calculator:
    image: ${IMAGE_NAME:-calculator-api}:${IMAGE_TAG:-latest}
    build: .
    environment:
      SERVER_PORT: "8080"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75.0"
      SPRING_PROFILES_ACTIVE: "${SPRING_PROFILES_ACTIVE:-default}"
    expose:
      - "8080"
    deploy:
      replicas: 2
    networks:
      - calc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${HOST_PORT:-8090}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      calculator:
        condition: service_healthy
    networks:
      - calc-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/nginx-health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

networks:
  calc-net:
    driver: bridge
