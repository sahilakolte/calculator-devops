upstream calculator_backend {
    # Docker's embedded DNS returns one IP per replica of the "calculator"
    # service, so requests are round-robined across all replicas.
    zone calculator_backend 64k;
    server calculator:8080;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass         http://calculator_backend;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header         X-Upstream        $upstream_addr always;
    }

    location = /nginx-health {
        access_log off;
        return 200 "OK\n";
    }
}
